<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GolfWind</title>
<style>body{font-family:system-ui;margin:0;background:#08130d;color:#fff}.wrap{max-width:480px;margin:auto;padding:18px}.card{background:#12251a;border:1px solid #244b32;border-radius:18px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#0b1d12;border-radius:14px;padding:14px;text-align:center}.big{font-size:34px;font-weight:800;color:#59e37c}label{display:block;margin:10px 0 5px}input{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #365843;background:#07130c;color:white;font-size:16px}button{width:100%;padding:14px;border:0;border-radius:12px;background:#38c762;color:#06110a;font-weight:800;font-size:16px}.muted{color:#9fb3a5}.err{color:#ff8d8d}</style></head>
<body><div class="wrap"><h1>⛳ GolfWind</h1><div class="muted">Ale GK • testversion</div>
<div class="card"><div class="grid"><div class="metric"><div id="speed" class="big">–</div><div>m/s</div></div><div class="metric"><div id="dir" class="big">–</div><div id="deg">vindriktning</div></div></div><br><button onclick="loadWind()">Uppdatera vind</button><p id="status" class="muted"></p></div>
<div class="card"><h3>Slaget</h3><label>Avstånd till mål (m)</label><input id="distance" type="number" value="175"><label>Slagriktning (°)</label><input id="shot" type="number" min="0" max="359" value="210"><br><br><button onclick="calc()">Beräkna</button></div>
<div class="card"><h3>Resultat</h3><div id="result" class="muted">Hämta vind och tryck Beräkna.</div></div>
</div><script>
const LAT=58.0041,LON=12.1825; let wind=null;
const compass=d=>['N','NO','O','SO','S','SV','V','NV'][Math.round(d/45)%8];
async function loadWind(){status.textContent='Hämtar vind…';try{let u=`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=wind_speed_10m,wind_direction_10m&wind_speed_unit=ms`;let j=await (await fetch(u)).json();wind={speed:j.current.wind_speed_10m,dir:j.current.wind_direction_10m};speed.textContent=wind.speed.toFixed(1);dir.textContent=compass(wind.dir);deg.textContent=wind.dir+'°';status.textContent='Vind uppdaterad';calc()}catch(e){status.innerHTML='<span class="err">Kunde inte hämta vind.</span>'}}
function calc(){if(!wind)return;let d=+distance.value,s=+shot.value;let rel=(wind.dir-s)*Math.PI/180;/* Meteorologisk riktning: vart vinden kommer från. Positiv head = motvind. */let head=wind.speed*Math.cos(rel),cross=wind.speed*Math.sin(rel);/* Enkel testmodell, avsiktligt konservativ tills modellen kalibrerats. */let play=Math.max(0,d*(1+0.02*head));let hc=head>=0?'Motvind':'Medvind',side=cross>=0?'från höger':'från vänster';result.innerHTML=`<b>${hc}:</b> ${Math.abs(head).toFixed(1)} m/s<br><b>Sidvind ${side}:</b> ${Math.abs(cross).toFixed(1)} m/s<br><br><span class="big">${Math.round(play)} m</span><br>PLAY AS <span class="muted">(testmodell)</span>`}
loadWind();
</script></body></html>
